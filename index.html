<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ler+ | Descubra o Livro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1410;
        overflow: hidden;
        font-family: 'Courier New', monospace;
      }
      #game-root {
        width: 100vw;
        height: 100vh;
        /* Centralização é feita pelo próprio Phaser (Scale.CENTER_BOTH),
           que já ajusta margin-left/margin-top do canvas. Usar flexbox
           aqui soma uma segunda centralização por cima, deslocando o
           canvas em telas com proporção muito diferente de 16:9. */
        position: relative;
      }
      /* Pixelart: sem suavização ao escalar */
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
